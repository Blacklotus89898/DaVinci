services:
  knowledge-service:
    # Pull the published image from GHCR. To build from source instead:
    #   docker compose up --build
    image: ghcr.io/blacklotus88888/knowledge-service:latest
    build: .
    restart: unless-stopped
    ports:
      - "3737:3737"
    volumes:
      - knowledge-data:/data
      - ./docs:/docs:ro
    environment:
      DB_PATH: /data/knowledge.db
      DOCS_PATH: /docs
      EMBED_PROVIDER: ollama
      EMBED_URL: http://ollama:11434
      EMBED_MODEL: nomic-embed-text
      LOG_LEVEL: info
    command: ["-http", ":3737"]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3737/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  knowledge-data:
  ollama-models:

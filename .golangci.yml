version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gosec
    - bodyclose
    - exhaustive
    # noctx disabled: v2 expanded it to flag every database/sql call without
    # context (db.Begin, tx.Query, stmt.Exec, etc.). Fixing requires adding
    # context.Context to all store methods — tracked as a separate refactor.
  settings:
    errcheck:
      exclude-functions:
        # Writing to http.ResponseWriter — errors handled by the framework.
        - (net/http.ResponseWriter).Write
        - fmt.Fprintln
        # database/sql cleanup — defer or error-path close, not actionable.
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        # HTTP response body close — standard deferred cleanup pattern.
        - (io.ReadCloser).Close

issues:
  exclude-rules:
    # Suppress errcheck on intentional fire-and-forget stmt.Exec in vocab rebuild.
    - path: internal/store/store\.go
      linters: [errcheck]
      text: "stmt.Exec"

version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gosec
    - noctx
    - bodyclose
    - exhaustive
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*database/sql.Tx).Rollback

issues:
  exclude-rules:
    - path: internal/store/store\.go
      linters: [errcheck]
      text: "stmt.Exec"

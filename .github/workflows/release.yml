name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" \
            -o dist/knowledge-service-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/knowledge-service
          go build -ldflags="${LDFLAGS}" \
            -o dist/knowledge-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/knowledge

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/checksums.txt
          generate_release_notes: true

      - name: Summary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "## 🚀 Release ${VERSION}"
            echo ""
            echo "### Binaries"
            echo ""
            echo "| Binary | Platform | Arch |"
            echo "|--------|----------|------|"
            echo "| \`knowledge-service-linux-amd64\` | Linux | x86-64 |"
            echo "| \`knowledge-service-linux-arm64\` | Linux | ARM64 |"
            echo "| \`knowledge-service-darwin-arm64\` | macOS | Apple Silicon |"
            echo "| \`knowledge-service-windows-amd64.exe\` | Windows | x86-64 |"
            echo "| \`knowledge-linux-amd64\` | Linux (CLI) | x86-64 |"
            echo "| \`knowledge-linux-arm64\` | Linux (CLI) | ARM64 |"
            echo "| \`knowledge-darwin-arm64\` | macOS (CLI) | Apple Silicon |"
            echo "| \`knowledge-windows-amd64.exe\` | Windows (CLI) | x86-64 |"
            echo ""
            echo "### Docker"
            echo ""
            echo "| Tag | Image |"
            echo "|-----|-------|"
            echo "| Version | \`ghcr.io/${REPO}:${VERSION#v}\` |"
            echo "| Major.Minor | \`ghcr.io/${REPO}:$(echo ${VERSION#v} | cut -d. -f1,2)\` |"
            echo "| Latest | \`ghcr.io/${REPO}:latest\` |"
            echo ""
            echo "### Verify"
            echo ""
            echo "\`\`\`bash"
            echo "# Download checksums and verify"
            echo "curl -sL https://github.com/${{ github.repository }}/releases/download/${VERSION}/checksums.txt -o checksums.txt"
            echo "sha256sum -c checksums.txt"
            echo ""
            echo "# Quick install (macOS Apple Silicon)"
            echo "curl -sL https://github.com/${{ github.repository }}/releases/download/${VERSION}/knowledge-service-darwin-arm64 \\"
            echo "  -o ~/.local/bin/knowledge-service && chmod +x ~/.local/bin/knowledge-service"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker (GHCR)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: VERSION=${{ github.ref_name }}

      - name: Summary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "## 🐳 Docker Image"
            echo ""
            echo "| Tag | Image |"
            echo "|-----|-------|"
            echo "| Version | \`ghcr.io/${REPO}:${VERSION#v}\` |"
            echo "| Major.Minor | \`ghcr.io/${REPO}:$(echo ${VERSION#v} | cut -d. -f1,2)\` |"
            echo "| Latest | \`ghcr.io/${REPO}:latest\` |"
            echo ""
            echo "**Platforms:** \`linux/amd64\` · \`linux/arm64\`"
            echo ""
            echo "### Pull"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ghcr.io/${REPO}:${VERSION#v}"
            echo "\`\`\`"
            echo ""
            echo "### Run"
            echo ""
            echo "\`\`\`bash"
            echo "docker run -d \\"
            echo "  -v \$(pwd)/docs:/docs:ro \\"
            echo "  -v \$(pwd)/knowledge.db:/data/knowledge.db \\"
            echo "  -e DOCS_PATH=/docs \\"
            echo "  -p 3737:3737 \\"
            echo "  ghcr.io/${REPO}:${VERSION#v} -http :3737"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

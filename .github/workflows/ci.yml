name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        # -coverpkg excludes the thin cmd/ entrypoints (no tests) from the coverage total.
        run: go test -race -count=1 -coverprofile=coverage.out -coverpkg=./internal/...,./mcp ./...

      - name: Coverage gate (70%)
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "value=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 70) { print "Coverage " cov "% is below 70% threshold"; exit 1 } }'

      - name: Build
        run: |
          go build -ldflags="-s -w" -o /dev/null ./cmd/knowledge-service
          go build -ldflags="-s -w" -o /dev/null ./cmd/knowledge

      - name: Summary
        if: always()
        run: |
          COV="${{ steps.coverage.outputs.value }}"
          if [ -n "$COV" ]; then
            COV_CELL="✅ ${COV}% (threshold 70%)"
          else
            COV_CELL="❌ Below 70% — see log above"
          fi
          {
            echo "## 🧪 Test Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| \`go vet\` | ✅ Pass |"
            echo "| Tests (race detector) | ✅ Pass |"
            echo "| Coverage | ${COV_CELL} |"
            echo "| Build | ✅ Pass |"
            echo ""
            echo "> Coverage measured over \`internal/\` and \`mcp/\` packages — thin \`cmd/\` entrypoints excluded."
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Install golangci-lint directly to avoid composite-action Node version issues.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" latest

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            LINT_STATUS="✅ Pass"
          else
            LINT_STATUS="❌ Failed — see log above"
          fi
          {
            echo "## 🔍 Lint Results"
            echo ""
            echo "| Tool | Status |"
            echo "|------|--------|"
            echo "| golangci-lint | ${LINT_STATUS} |"
            echo ""
            echo "**Active linters:** \`errcheck\` · \`gosimple\` · \`govet\` · \`ineffassign\` · \`staticcheck\` · \`unused\` · \`gosec\` · \`noctx\` · \`bodyclose\` · \`exhaustive\`"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the latest stable Go so govulncheck sees a fully-patched stdlib.
      # CVEs in Go's own crypto/tls or x509 packages are only fixed by upgrading Go;
      # they are not actionable from within the module.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            VULN_STATUS="✅ No vulnerabilities found"
          else
            VULN_STATUS="❌ Vulnerabilities found — see log above"
          fi
          {
            echo "## 🔒 Security Scan"
            echo ""
            echo "| Tool | Status |"
            echo "|------|--------|"
            echo "| govulncheck | ${VULN_STATUS} |"
            echo ""
            echo "> Go **stable** is used so the scanner sees a fully-patched stdlib, avoiding false-positive CVEs in \`crypto/tls\` / \`x509\`."
          } >> "$GITHUB_STEP_SUMMARY"
